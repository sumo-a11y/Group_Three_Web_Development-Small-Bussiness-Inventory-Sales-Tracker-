<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../styles/login.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <title>Log In</title>
  </head>
  <body>
    <div class="wrapper">
      <!-- LEFT PANEL -->
      <div class="left">
        <div class="logo">
          <div class="logo-box"></div>
          <h2>CheckIt Na Na</h2>
        </div>
        <br>

        <!-- <h3>Take control of your inventory like never before</h3> -->

        <p>Continue managing your inventory with CheckIt Na Na 
            and grow your business with confidence. 
            Log in to your account and take control of your inventory today!</p>
        </p>
      </div>

      <!-- RIGHT PANEL -->
      <div class="right">
        <!-- <h2>Create account</h2> -->

        <div class="top-row">
          <h2>Welcome back</h2>
          <a href="../htmls/signIn.html">Sign Up</a>
        </div>

        <p class="subtext">Start your inventory management journey</p>

        <div class="icon-text">
          <i class="ri-google-fill"></i>
          <span>Continue With Google</span>
        </div>

        <div class="divider">Or continue with email</div>

        <div class="form-group">
          <label>Email Address</label>
          <input type="email" placeholder="Enter your email" />
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" placeholder="Enter your password" />
        </div>

        <div class="checkbox">
          <input type="checkbox" />
          <span>Remember me</span>
        </div>

        <button class="create-btn">Sign In</button>
      </div>
    </div>
  </body>
</html>
